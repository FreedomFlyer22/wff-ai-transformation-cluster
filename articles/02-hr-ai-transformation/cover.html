<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover — AI for HR</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 628px; overflow: hidden; background: #000; font-family: 'Satoshi', -apple-system, sans-serif; }
  .canvas {
    width: 1200px; height: 628px; position: relative;
    background: radial-gradient(ellipse at 80% 90%, #1a0800 0%, #000000 55%);
    display: flex; align-items: stretch;
  }
  .left { flex: 1; padding: 64px 64px 64px 64px; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2; }
  .dot-grid {
    position: absolute; top: 0; left: 0; right: 320px; bottom: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 32px 32px; opacity: 0.4; z-index: 1;
  }
  .logo { margin-bottom: 40px; }
  .logo-text { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .logo-dot { color: #f3610c; }
  .headline { position: relative; z-index: 2; }
  .headline-line1 { font-size: 68px; font-weight: 900; color: #fff; letter-spacing: -2.5px; line-height: 1.0; display: block; }
  .headline-line2 { font-size: 56px; font-weight: 700; color: #fff; letter-spacing: -1.5px; line-height: 1.05; display: block; margin-top: 4px; }
  .accent-rule { width: 48px; height: 2px; background: #f3610c; margin: 20px 0; box-shadow: 0 0 6px rgba(243,97,12,0.5); }
  .subheadline { font-size: 20px; font-weight: 400; color: #999; line-height: 1.5; max-width: 620px; position: relative; z-index: 2; }
  .pill { position: absolute; bottom: 48px; left: 64px; background: #f3610c; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; padding: 8px 18px; border-radius: 100px; z-index: 2; }
  .right {
    width: 320px; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(243,97,12,0.08) 0%, rgba(243,97,12,0.14) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; padding: 40px 24px;
  }
  .connector-line {
    position: absolute; left: 50%; top: 60px; bottom: 60px; width: 2px;
    background: #f3610c; transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(243,97,12,0.6);
  }
  .icon-stack { display: flex; flex-direction: column; gap: 52px; align-items: center; position: relative; z-index: 2; }
  .icon-item { display: flex; align-items: center; gap: 12px; }
  .icon-wrap {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); border-radius: 8px;
  }
  .icon-wrap.active { width: 40px; height: 40px; background: rgba(243,97,12,0.15); border: 1px solid rgba(243,97,12,0.4); }
  .icon-wrap svg { opacity: 0.7; }
  .icon-wrap.active svg { opacity: 1.0; }
  .icon-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.6); letter-spacing: 0.3px; width: 60px; }
  .active-dot { width: 8px; height: 8px; background: #f3610c; border-radius: 50%; position: absolute; left: calc(50% - 20px); box-shadow: 0 0 6px rgba(243,97,12,0.8); }
</style>
</head>
<body>
<div class="canvas">
  <div class="dot-grid"></div>
  <div class="left">
    <div class="logo"><span class="logo-text">WorkflowFiesta<span class="logo-dot">.</span></span></div>
    <div class="headline">
      <span class="headline-line1">AI for HR:</span>
      <span class="headline-line2">The 5 Workflows</span>
      <span class="headline-line2">to Automate First</span>
    </div>
    <div class="accent-rule"></div>
    <p class="subheadline">Recruiting, onboarding, PTO, performance reviews, and offboarding — with trigger-action sequences for each.</p>
    <div class="pill">workflowfiesta.com</div>
  </div>
  <div class="right">
    <div class="connector-line"></div>
    <div class="icon-stack">
      <div class="icon-item">
        <div class="icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <span class="icon-label">Recruiting</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <span class="icon-label" style="color:rgba(255,255,255,0.9)">Onboarding</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <span class="icon-label">PTO</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <span class="icon-label">Reviews</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
        <span class="icon-label">Offboarding</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

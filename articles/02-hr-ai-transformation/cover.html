<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Cover — How AI Transforms Your HR Department</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 628px; overflow: hidden; background: #000; font-family: 'Satoshi', -apple-system, sans-serif; }

  .canvas {
    width: 1200px;
    height: 628px;
    background: #000;
    background-image: radial-gradient(ellipse at 80% 90%, #1a0500 0%, #000 55%);
    position: relative;
    display: flex;
    overflow: hidden;
  }

  /* Dot grid — left zone only */
  .dot-grid {
    position: absolute;
    top: 0; left: 0;
    width: 860px; height: 628px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Left content zone */
  .left {
    flex: 1;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; background: #F3610C; border-radius: 50%; }

  .copy { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0; margin-top: -20px; }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #F3610C;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -3px;
    color: #fff;
    margin-bottom: 0;
  }
  h1 span { color: #F3610C; }

  .rule {
    width: 48px;
    height: 3px;
    background: #F3610C;
    margin: 22px 0;
    box-shadow: 0 0 8px rgba(243,97,12,0.5);
  }

  .sub {
    font-size: 20px;
    font-weight: 400;
    color: #888;
    line-height: 1.5;
    max-width: 580px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #F3610C;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 8px 16px;
    border-radius: 100px;
    width: fit-content;
  }

  /* Right accent column */
  .right {
    width: 300px;
    height: 628px;
    background: linear-gradient(180deg, rgba(243,97,12,0.06) 0%, rgba(243,97,12,0.13) 100%);
    border-left: 1px solid rgba(243,97,12,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    gap: 0;
  }

  /* Vertical connector line */
  .vline {
    position: absolute;
    left: 50%;
    top: 60px;
    bottom: 60px;
    width: 2px;
    background: #F3610C;
    transform: translateX(-50%);
    box-shadow: 0 0 10px rgba(243,97,12,0.6);
  }

  .icon-stack {
    display: flex;
    flex-direction: column;
    gap: 0;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 3;
    padding: 60px 0;
    justify-content: space-between;
    height: 100%;
  }

  .icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .icon-circle {
    width: 44px;
    height: 44px;
    background: #111;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle.active {
    background: #1a0800;
    border-color: #F3610C;
    box-shadow: 0 0 16px rgba(243,97,12,0.4);
    width: 52px;
    height: 52px;
  }

  .icon-circle svg { opacity: 0.6; }
  .icon-circle.active svg { opacity: 1; }

  .icon-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  .icon-item.active .icon-label { color: #F3610C; }
</style>
</head>
<body>
<div class="canvas">
  <div class="dot-grid"></div>

  <div class="left">
    <div class="logo">
      <div class="logo-dot"></div>
      WorkflowFiesta
    </div>

    <div class="copy">
      <div class="eyebrow">AI Transformation Series</div>
      <h1>How AI Transforms<br>Your <span>HR</span><br>Department</h1>
      <div class="rule"></div>
      <p class="sub">The 5 recruiting and people ops workflows to automate first — no engineers required.</p>
    </div>

    <div class="pill">workflowfiesta.com</div>
  </div>

  <div class="right">
    <div class="vline"></div>
    <div class="icon-stack">

      <!-- Recruiting -->
      <div class="icon-item active">
        <div class="icon-circle active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3610C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
        <span class="icon-label">Recruiting</span>
      </div>

      <!-- Onboarding -->
      <div class="icon-item">
        <div class="icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <span class="icon-label">Onboarding</span>
      </div>

      <!-- PTO -->
      <div class="icon-item">
        <div class="icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <span class="icon-label">PTO</span>
      </div>

      <!-- Reviews -->
      <div class="icon-item">
        <div class="icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <span class="icon-label">Reviews</span>
      </div>

      <!-- Offboarding -->
      <div class="icon-item">
        <div class="icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <span class="icon-label">Offboarding</span>
      </div>

    </div>
  </div>
</div>
</body>
</html>

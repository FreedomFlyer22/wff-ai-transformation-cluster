<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Transformation Guide Cover</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000000;
  }

  .cover {
    width: 1200px;
    height: 628px;
    position: relative;
    background: linear-gradient(135deg, #000000 0%, #0d0d0d 40%, #1a0800 70%, #2d1000 100%);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Background grid pattern */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(243, 97, 12, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(243, 97, 12, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Orange glow orb */
  .glow-orb {
    position: absolute;
    right: -80px;
    top: 50%;
    transform: translateY(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(243, 97, 12, 0.25) 0%, rgba(243, 97, 12, 0.08) 40%, transparent 70%);
    border-radius: 50%;
  }

  /* Department nodes visual */
  .nodes-container {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    width: 380px;
    height: 480px;
  }

  .node {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.85;
  }

  .node-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #F3610C;
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(243, 97, 12, 0.6);
  }

  .node-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  /* Connecting lines */
  .connector {
    position: absolute;
    background: linear-gradient(90deg, rgba(243, 97, 12, 0.5), transparent);
    height: 1px;
    transform-origin: left center;
  }

  /* Center hub */
  .hub {
    position: absolute;
    right: 175px;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F3610C;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(243, 97, 12, 0.5), 0 0 60px rgba(243, 97, 12, 0.2);
    z-index: 10;
  }

  .hub-icon {
    font-size: 22px;
  }

  /* Left content */
  .content {
    position: relative;
    z-index: 10;
    padding: 64px 0 64px 72px;
    max-width: 680px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(243, 97, 12, 0.12);
    border: 1px solid rgba(243, 97, 12, 0.3);
    border-radius: 100px;
    padding: 6px 16px;
    margin-bottom: 28px;
  }

  .eyebrow-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F3610C;
  }

  .eyebrow-text {
    font-size: 12px;
    font-weight: 700;
    color: #F3610C;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .headline {
    font-size: 58px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }

  .headline .highlight {
    color: #F3610C;
  }

  .subheadline {
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    line-height: 1.5;
    margin-bottom: 36px;
    max-width: 480px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-icon {
    font-size: 14px;
    opacity: 0.6;
  }

  .meta-text {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
  }

  .meta-divider {
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.15);
  }

  /* Logo */
  .logo {
    position: absolute;
    bottom: 32px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    background: #F3610C;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-mark-inner {
    width: 14px;
    height: 14px;
    border: 2px solid white;
    border-radius: 3px;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: -0.3px;
  }

  /* Bottom accent line */
  .accent-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #F3610C 0%, rgba(243, 97, 12, 0.3) 50%, transparent 100%);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="grid-overlay"></div>
  <div class="glow-orb"></div>

  <!-- Department nodes -->
  <div class="nodes-container">
    <!-- Hub center -->
    <div class="hub">
      <span class="hub-icon">⚡</span>
    </div>

    <!-- Nodes positioned around hub -->
    <div class="node" style="top: 30px; right: 20px;">
      <div class="node-dot"></div>
      <span class="node-label">HR & People Ops</span>
    </div>
    <div class="node" style="top: 100px; right: 0px;">
      <div class="node-dot"></div>
      <span class="node-label">Marketing</span>
    </div>
    <div class="node" style="top: 175px; right: 10px;">
      <div class="node-dot"></div>
      <span class="node-label">Finance</span>
    </div>
    <div class="node" style="top: 250px; right: 5px;">
      <div class="node-dot"></div>
      <span class="node-label">Sales</span>
    </div>
    <div class="node" style="top: 325px; right: 0px;">
      <div class="node-dot"></div>
      <span class="node-label">Customer Success</span>
    </div>
    <div class="node" style="top: 400px; right: 15px;">
      <div class="node-dot"></div>
      <span class="node-label">Operations & IT</span>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">
    <div class="eyebrow">
      <div class="eyebrow-dot"></div>
      <span class="eyebrow-text">WorkflowFiesta Guide · 2026</span>
    </div>

    <h1 class="headline">
      The <span class="highlight">AI Transformation</span><br>
      Playbook
    </h1>

    <p class="subheadline">
      Department by department. Real workflows.<br>
      No consultants required.
    </p>

    <div class="meta-row">
      <div class="meta-item">
        <span class="meta-icon">📖</span>
        <span class="meta-text">3,500 words</span>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-item">
        <span class="meta-icon">⏱</span>
        <span class="meta-text">14 min read</span>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-item">
        <span class="meta-icon">🏢</span>
        <span class="meta-text">6 departments covered</span>
      </div>
    </div>
  </div>

  <!-- Logo -->
  <div class="logo">
    <div class="logo-mark">
      <div class="logo-mark-inner"></div>
    </div>
    <span class="logo-text">WorkflowFiesta</span>
  </div>

  <div class="accent-line"></div>
</div>
</body>
</html>

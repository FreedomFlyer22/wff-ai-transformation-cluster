<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Cover — AI Content Marketing</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 628px; overflow: hidden; background: #000; font-family: 'Satoshi', -apple-system, sans-serif; }
  .canvas { width: 1200px; height: 628px; position: relative; background: radial-gradient(ellipse at 80% 90%, #1a0800 0%, #000000 55%); display: flex; align-items: stretch; }
  .dot-grid { position: absolute; top: 0; left: 0; width: 880px; height: 628px; background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.4; z-index: 1; }
  .right { width: 320px; flex-shrink: 0; background: linear-gradient(180deg, rgba(243,97,12,0.08) 0%, rgba(243,97,12,0.14) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px 24px; }
  .connector-line { position: absolute; left: 50%; top: 60px; bottom: 60px; width: 2px; background: #f3610c; transform: translateX(-50%); box-shadow: 0 0 8px rgba(243,97,12,0.6); }
  .icon-stack { display: flex; flex-direction: column; gap: 48px; align-items: center; position: relative; z-index: 2; }
  .icon-item { display: flex; align-items: center; gap: 10px; }
  .icon-wrap { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); border-radius: 8px; }
  .icon-wrap.active { width: 40px; height: 40px; background: rgba(243,97,12,0.15); border: 1px solid rgba(243,97,12,0.4); }
  .icon-wrap svg { stroke: rgba(255,255,255,0.7); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon-wrap.active svg { stroke: #fff; }
  .icon-label { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.55); letter-spacing: 0.3px; width: 64px; }
  .icon-item.active .icon-label { color: rgba(255,255,255,0.9); }
  .left { flex: 1; padding: 52px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 2; }
  .logo-text { font-size: 17px; font-weight: 700; color: #fff; }
  .logo-dot { color: #f3610c; }
  .headline { margin: auto 0; }
  .hl1 { display: block; font-size: 70px; font-weight: 900; color: #fff; letter-spacing: -2.5px; line-height: 1.0; }
  .hl2 { display: block; font-size: 62px; font-weight: 900; color: #fff; letter-spacing: -2px; line-height: 1.0; }
  .hl3 { display: block; font-size: 62px; font-weight: 700; color: #f3610c; letter-spacing: -2px; line-height: 1.05; }
  .rule { width: 48px; height: 2px; background: #f3610c; box-shadow: 0 0 6px rgba(243,97,12,0.5); margin: 18px 0; }
  .sub { font-size: 17px; font-weight: 400; color: #999; line-height: 1.5; max-width: 600px; }
  .pill { display: inline-block; background: #f3610c; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; padding: 7px 16px; border-radius: 100px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="dot-grid"></div>
  <div class="left">
    <div><span class="logo-text">WorkflowFiesta<span class="logo-dot">.</span></span></div>
    <div class="headline">
      <span class="hl1">AI Content</span>
      <span class="hl2">Marketing: The 5</span>
      <span class="hl3">Workflows That Run Themselves</span>
      <div class="rule"></div>
      <p class="sub">Content pipeline, campaign monitoring, social calendar, email sequences, and competitive intelligence — automated.</p>
    </div>
    <div><span class="pill">workflowfiesta.com</span></div>
  </div>
  <div class="right">
    <div class="connector-line"></div>
    <div class="icon-stack">
      <div class="icon-item active">
        <div class="icon-wrap active"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
        <span class="icon-label">Content</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg></div>
        <span class="icon-label">Campaigns</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
        <span class="icon-label">Social</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
        <span class="icon-label">Email</span>
      </div>
      <div class="icon-item">
        <div class="icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <span class="icon-label">Intel</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
